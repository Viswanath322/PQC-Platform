# gitleaks config for teammates who have gitleaks installed:
#   gitleaks detect --source . --config tests/security/.gitleaks.toml
title = "PQC Platform gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Intentionally vulnerable demo repo (fake secrets) and dev placeholders"
paths = [
  '''tests/fixtures/vulnerable-demo-repo/''',
  '''^vulnerable-demo-repo/''',
  '''tests/security/''',
]
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''FAKE-DEMO-PASSWORD-DO-NOT-USE''',
  '''change_me_locally''',
]
