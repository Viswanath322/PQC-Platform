[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-engines"
version = "0.1.0"
description = "Deterministic AST and heuristic detection engines for the PQC Security Assessment Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.package-dir]
analysis_engines = "."

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
